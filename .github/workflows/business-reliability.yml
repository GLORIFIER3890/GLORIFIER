name: GLORIFIER Daily Business Reliability

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-business-reliability
  cancel-in-progress: false

jobs:
  verify-core-services:
    name: Verify architecture, governance and settlement safeguards
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check application
        run: npm run lint

      - name: Test agent approval harness
        run: npm run test:harness

      - name: Test core architecture governance
        run: npm run test:architecture

      - name: Test GEAS reconciliation and controls
        run: npm run test:geas-reconciliation && npm run test:geas-controls && npm run test:geas-enterprise-controls

      - name: Test permanent orchestration stack
        run: npm run test:permanent-stack

      - name: Test GLR economic layer and commerce rules
        run: npm run test:glr-economic-layer && npm run test:glr-commerce

      - name: Test Ethereum payment verification
        run: npm run test:glr-ethereum-verifier

      - name: Test BNB payment verification
        run: npm run test:glr-bnb-verifier

      - name: Test Solana payment verification
        run: npm run test:glr-solana-verifier
