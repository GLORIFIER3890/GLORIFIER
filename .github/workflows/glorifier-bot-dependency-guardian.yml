name: GLORIFIER Bot — Dependency Guardian

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: glorifier-bot-dependency-guardian
  cancel-in-progress: false

jobs:
  prepare-and-test:
    name: Prepare and test safe dependency refresh
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Refresh versions within declared semver ranges
        run: npm update

      - name: Reinstall exact refreshed lockfile
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Create GLORIFIER Bot pull request
        if: success()
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: bot/glorifier-dependency-refresh
          delete-branch: true
          add-paths: |
            package.json
            package-lock.json
          commit-message: "chore(deps): refresh versions within declared ranges"
          title: "chore(deps): GLORIFIER Bot dependency refresh"
          body: |
            ## GLORIFIER Bot — dependency refresh

            This pull request updates npm dependencies only within the version ranges already declared by the project.

            - Generated by the scheduled/manual GLORIFIER Bot workflow.
            - CI and repository security checks must pass before merge.
            - This bot does not merge pull requests, deploy production, change credentials, or modify financial/blockchain state.
            - If an optional GLORIFIER GitHub App is configured, future iterations can use its token for app-attributed PRs. Without that app token, GitHub attributes the PR to the GitHub Actions bot.
          labels: |
            dependencies
            automated
          draft: true
