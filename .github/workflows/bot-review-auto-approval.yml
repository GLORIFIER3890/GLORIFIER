name: Bot Review Auto-Approval Gate

on:
  # Deliberately manual: check_suite events fan out across every check and caused repeated runs.
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: "PR number to evaluate"
        required: true
        type: number

permissions:
  actions: read
  contents: read
  pull-requests: write
  checks: read

concurrency:
  group: bot-review-auto-approval-${{ inputs.pull_request_number || github.run_id }}
  cancel-in-progress: false

jobs:
  evaluate:
    name: Validate bot review and CI before approval
    runs-on: ubuntu-latest
    env:
      PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
    steps:
      - name: Evaluate trusted bot review, open threads, risk paths, and checks
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Identify this workflow's own checks by run/check-run identity, not by a reusable display name.
            const currentJobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner, repo, run_id: context.runId, per_page: 100
            });
            const ownCheckRunIds = new Set(currentJobs.map(job => job.id));

            const requestedNumber = Number(process.env.PULL_REQUEST_NUMBER || 0);
            if (!Number.isSafeInteger(requestedNumber) || requestedNumber < 1) {
              core.setFailed('Manual approval evaluation requires a valid pull_request_number input.');
              return;
            }
            const pr = (await github.rest.pulls.get({
              owner, repo, pull_number: requestedNumber
            })).data;

            const number = pr.number;
            const headSha = pr.head.sha;
            const stop = reason => {
              core.notice(`PR #${number}: approval withheld — ${reason}`);
              core.setOutput('decision', 'withheld');
            };

            if (pr.state !== 'open' || pr.draft) return stop('PR is closed or still a draft.');
            if (pr.base?.ref !== 'main') return stop('base branch is not main.');
            if (pr.mergeable === false || pr.mergeable_state === 'dirty') return stop('merge conflicts are present.');
            if (pr.head.repo?.full_name !== `${owner}/${repo}`) return stop('fork-origin PRs require human review.');
            const triggeringActor = process.env.GITHUB_TRIGGERING_ACTOR;
            if (pr.user?.login === owner ||
                pr.user?.login === context.actor ||
                pr.user?.login === triggeringActor) {
              return stop('PRs authored by the repository owner, original actor, or rerun initiator require independent human review.');
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: number, per_page: 100
            });
            const highRisk = /(^|\/)(\.github\/workflows|\.github\/CODEOWNERS|CODEOWNERS|.*secret.*|.*credential.*|.*migration.*|.*deploy.*|.*release.*|.*payment.*|.*payout.*|.*wallet.*|.*contract.*|.*auth.*|.*security.*)(\/|$|\.)/i;
            const riskyFiles = files.filter(file =>
              highRisk.test(file.filename) || (file.previous_filename && highRisk.test(file.previous_filename))
            );
            if (riskyFiles.length > 0) {
              return stop(`sensitive paths require human review: ${riskyFiles.map(file => file.filename).join(', ')}`);
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner, repo, pull_number: number, per_page: 100
            });
            // Only explicitly trusted review integrations may satisfy the bot-evidence gate.
            // Generic bot accounts and GitHub Actions must never count as independent review.
            const trustedReviewBots = new Set(['coderabbitai[bot]', 'deepsource-io[bot]', 'snyk-bot']);
            const botLogin = user => trustedReviewBots.has(user?.login || '');
            const currentHeadBotReviews = reviews.filter(review =>
              botLogin(review.user) && review.commit_id === headSha
            );
            if (currentHeadBotReviews.some(review => review.state === 'CHANGES_REQUESTED')) {
              return stop('a bot requested changes on the exact current head; fix findings before approval.');
            }
            const substantiveReviews = currentHeadBotReviews.filter(review =>
              ['COMMENTED', 'APPROVED'].includes(review.state) && (review.body || '').trim().length > 0
            );
            if (substantiveReviews.length === 0) {
              return stop('no substantive recognized bot review exists for the exact current head commit.');
            }

            if (reviews.some(review => review.state === 'CHANGES_REQUESTED' && !botLogin(review.user))) {
              return stop('a human reviewer requested changes.');
            }

            const inlineComments = await github.paginate(github.rest.pulls.listReviewComments, {
              owner, repo, pull_number: number, per_page: 100
            });
            const currentHeadBotComments = inlineComments.filter(comment =>
              botLogin(comment.user) && comment.commit_id === headSha
            );
            if (currentHeadBotComments.length === 0) {
              return stop('no inline bot findings exist on the exact current head; no auto-approval.');
            }

            const threadData = await github.graphql(
              `query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    reviewThreads(first: 100) {
                      pageInfo { hasNextPage }
                      nodes {
                        isResolved
                        comments(first: 20) {
                          nodes { author { login __typename } body }
                        }
                      }
                    }
                  }
                }
              }`,
              { owner, repo, number }
            );
            const reviewThreads = threadData.repository.pullRequest.reviewThreads;
            if (reviewThreads.pageInfo.hasNextPage) {
              return stop('more than 100 review threads exist; full pagination must be reviewed before approval.');
            }
            const threads = reviewThreads.nodes;
            const unresolved = threads.filter(thread => !thread.isResolved);
            if (unresolved.length > 0) {
              return stop(`${unresolved.length} review thread(s) remain unresolved; fix or explicitly resolve them with evidence first.`);
            }

            const allRuns = await github.paginate(github.rest.checks.listForRef, {
              owner, repo, ref: headSha, per_page: 100
            });
            // Exclude only this workflow run's own checks; other checks with the same display name still count.
            const runs = allRuns.filter(run => !ownCheckRunIds.has(run.id));
            const combinedStatus = await github.rest.repos.getCombinedStatusForRef({ owner, repo, ref: headSha });
            if (combinedStatus.data.state !== 'success') {
              return stop(`combined commit status is ${combinedStatus.data.state}; required status contexts must pass.`);
            }
            if (runs.length === 0) return stop('no check runs were found for the exact PR head commit.');
            const unfinished = runs.filter(run => run.status !== 'completed');
            if (unfinished.length > 0) return stop(`${unfinished.length} check run(s) are still running.`);
            const failures = runs.filter(run => !['success', 'neutral', 'skipped'].includes(run.conclusion));
            if (failures.length > 0) {
              return stop(`failed/unknown checks: ${failures.map(run => `${run.name}=${run.conclusion}`).join(', ')}`);
            }

            const existingApproval = reviews.some(review =>
              review.state === 'APPROVED' && review.commit_id === headSha && review.user?.login === 'github-actions[bot]'
            );
            if (existingApproval) {
              core.notice(`PR #${number}: this head already has an automation approval.`);
              return;
            }

            await github.rest.pulls.createReview({
              owner, repo, pull_number: number, commit_id: headSha, event: 'APPROVE',
              body: 'Automated review gate: recognized bot review on the exact current head; all review threads resolved; all available checks completed successfully; no human change request or sensitive-path changes detected. This approval is not a merge authorization. Human review remains required for security, deployment, database, identity, payment, wallet, contract, workflow, or release changes.'
            });
            core.notice(`PR #${number}: approved at ${headSha}. No merge was performed.`);
