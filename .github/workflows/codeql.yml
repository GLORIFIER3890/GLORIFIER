name: GLORIFIER CodeQL Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

      - name: Inventory open CodeQL alerts on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          report="codeql-open-alerts.jsonl"
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?tool_name=CodeQL&state=open&per_page=100" \
            --jq '.[] | {
              number: .number,
              severity: .rule.severity,
              rule: .rule.id,
              description: .rule.description,
              html_url: .html_url,
              path: .most_recent_instance.location.path,
              start_line: .most_recent_instance.location.start_line,
              message: .most_recent_instance.message.text
            }' > "$report"

          count="$(awk 'END { print NR+0 }' "$report")"
          {
            echo "## Open CodeQL alert inventory"
            echo ""
            echo "- Repository: `$GITHUB_REPOSITORY`"
            echo "- Reference: default branch (queried after the scan upload)"
            echo "- Open CodeQL alerts returned by GitHub: **$count**"
            echo ""
            if [ "$count" -eq 0 ]; then
              echo "No open CodeQL alerts were returned by the API."
            else
              echo "| Alert | Severity | Rule | Location | GitHub |"
              echo "|---:|---|---|---|---|"
              jq -r '"| \(.number) | \(.severity // "unknown") | `\(.rule // "unknown")` | `\(.path // "?"):\(.start_line // 0)` | [Open alert](\(.html_url)) |"' "$report"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Open CodeQL alerts: $count"
          cat "$report"

      - name: Upload CodeQL alert inventory
        uses: actions/upload-artifact@v4
        with:
          name: codeql-open-alert-inventory
          path: codeql-open-alerts.jsonl
          if-no-files-found: error
          retention-days: 14
