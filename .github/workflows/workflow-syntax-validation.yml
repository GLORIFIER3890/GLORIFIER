name: Workflow Syntax Validation

on:
  pull_request:
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: Lint workflow syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proposed workflow changes
        uses: actions/checkout@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate workflow syntax
        uses: reviewdog/action-actionlint@3cbf14efd750961dba35fccbf00f9e14028cb1f5
        with:
          actionlint_flags: "-color"
          fail_level: error
